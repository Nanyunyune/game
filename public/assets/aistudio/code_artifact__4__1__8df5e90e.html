            for (const e of state.enemies) {
              if (e.dead) continue;
              const eb = { x: e.x - e.w * 0.55, y: e.y - e.h - 4, w: e.w * 1.1, h: e.h + 8 };
              if (rectsOverlap(pb, eb)) {
                hitEnemy(e, parryCfg, Math.sign(pr.vx) || 1);
                state.time.hitStop = Math.max(state.time.hitStop, 0.065);
                addScreenShake(6.5, 0.16);
                hitTarget = true;
                break;
              }
            }
            if (!hitTarget && state.boss && state.boss.active && !state.boss.dead) {
              const b = state.boss;
              const bb = { x: b.x - b.w * 0.5, y: b.y - b.h, w: b.w, h: b.h };
              if (rectsOverlap(pb, bb)) {
                hitBoss(b, parryCfg, Math.sign(pr.vx) || 1);
                state.time.hitStop = Math.max(state.time.hitStop, 0.075);
                addScreenShake(7.5, 0.18);
                hitTarget = true;
              }
            }
            if (hitTarget) state.projectiles.splice(i, 1);
            continue;
          }

          const pb = { x: pr.x - pr.r, y: pr.y - pr.r, w: pr.r * 2, h: pr.r * 2 };
          // 木箱格挡光弹
          let blocked = false;
          for (const c of state.crates) {
            if (c.broken) continue;
            const cb = { x: c.x - c.w * 0.5, y: c.y - c.h, w: c.w, h: c.h };
            if (rectsOverlap(pb, cb)) {
              spawnHitVfx(pr.x, pr.y, -Math.sign(pr.vx), 0, false, '#67e8f9');
              blocked = true;
              break;
            }
          }
          if (blocked) { state.projectiles.splice(i, 1); continue; }

          if (rectsOverlap(pb, pBox)) {
            damagePlayer(pr.dmg, pr.x);
            state.projectiles.splice(i, 1);
          }
        }

        // Boss 地面震荡波
        for (let i = state.shockwaves.length - 1; i >= 0; i--) {
          const sw = state.shockwaves[i];
          sw.life -= dt;
          sw.x += sw.dir * sw.speed * dt;
          if (sw.life <= 0 || sw.x < BOSS_ARENA_LEFT || sw.x > BOSS_ARENA_RIGHT) {
            state.shockwaves.splice(i, 1);
            continue;
          }
          const sb = { x: sw.x - sw.w * 0.5, y: sw.y - sw.h, w: sw.w, h: sw.h };
          if (rectsOverlap(sb, pBox)) {
            damagePlayer(25, sw.x);
          }
        }
      }

      function updateOrbs(rawDt) {
        if (state.goldPulse > 0) state.goldPulse = Math.max(0, state.goldPulse - rawDt);
        if (state.coinComboTimer > 0) {
          state.coinComboTimer -= rawDt;
          if (state.coinComboTimer <= 0) state.coinCombo = 0;
        }
        const targetX = 36;
        const targetY = 58;

        for (let i = state.orbs.length - 1; i >= 0; i--) {
          const o = state.orbs[i];
          o.timer += rawDt;
          if (o.phase === 'scatter') {
            o.vy += 680 * rawDt;
            o.wx += o.vx * rawDt;
            o.wy += o.vy * rawDt;
            if (o.wy >= o.floorY - 4) {
              o.wy = o.floorY - 4;
              o.vy = -Math.abs(o.vy) * 0.42;
              o.vx *= 0.65;
            }
            if (o.timer >= o.scatterDur) {
              o.phase = 'pause';
              o.timer = 0;
            }
          } else if (o.phase === 'pause') {
            if (o.timer >= o.pauseDur) {
              o.phase = 'fly';
              o.timer = 0;
              o.sx = o.wx - state.camera.x;
              o.sy = o.wy;
              o.scrX = o.sx;
              o.scrY = o.sy;
              o.cx = (o.sx + targetX) * 0.5 + (Math.random() - 0.5) * 140;
              o.cy = Math.min(o.sy, targetY) - 85 - Math.random() * 65;
              o.trail = [{ x: o.scrX, y: o.scrY }];
            }
          } else {
            const t = clamp(o.timer / o.flyDur, 0, 1);
            const e = Easing.easeInQuad(t);
            const omt = 1 - e;
            o.scrX = omt * omt * o.sx + 2 * omt * e * o.cx + e * e * targetX;
            o.scrY = omt * omt * o.sy + 2 * omt * e * o.cy + e * e * targetY;
            o.trail.push({ x: o.scrX, y: o.scrY });
            if (o.trail.length > 8) o.trail.shift();

            if (t >= 1) {
              state.gold += 1;
              state.goldPulse = 0.16;
              state.coinComboTimer = 0.55;
              AudioSys.playCoin(state.coinCombo++);
              state.orbs.splice(i, 1);
            }
          }
        }
      }

      function updateVfx(dt) {
        const v = state.vfx;
        for (let i = v.slashes.length - 1; i >= 0; i--) {
          v.slashes[i].life -= dt;
          if (v.slashes[i].life <= 0) v.slashes.splice(i, 1);
        }
        for (let i = v.sparks.length - 1; i >= 0; i--) {
          const s = v.sparks[i];
          s.life -= dt;
          s.x += s.vx * dt; s.y += s.vy * dt;
          s.vx *= 0.92; s.vy += 320 * dt;
          if (s.life <= 0) v.sparks.splice(i, 1);
        }
        for (let i = v.rings.length - 1; i >= 0; i--) {
          v.rings[i].life -= dt;
          if (v.rings[i].life <= 0) v.rings.splice(i, 1);
        }
        for (let i = v.dust.length - 1; i >= 0; i--) {
          const d = v.dust[i];
          d.life -= dt;
          d.x += d.vx * dt; d.y += d.vy * dt;
          if (d.life <= 0) v.dust.splice(i, 1);
        }
        for (let i = v.debris.length - 1; i >= 0; i--) {
          const d = v.debris[i];
          d.life -= dt;
          d.vy += 760 * dt;
          d.x += d.vx * dt; d.y += d.vy * dt;
          d.rot += d.vrot * dt;
          if (d.life <= 0) v.debris.splice(i, 1);
        }
        for (let i = v.dmgNums.length - 1; i >= 0; i--) {
          const n = v.dmgNums[i];
          n.life -= dt;
          n.x += n.vx * dt; n.y += n.vy * dt;
          n.vy += 260 * dt;
          if (n.life <= 0) v.dmgNums.splice(i, 1);
        }
        for (let i = v.afterimages.length - 1; i >= 0; i--) {
          v.afterimages[i].life -= dt;
          if (v.afterimages[i].life <= 0) v.afterimages.splice(i, 1);
        }
      }

      function updateCamera(rawDt) {
        const cam = state.camera;
        const p = state.player;
        const targetX = cam.bossLocked
          ? BOSS_ARENA_LEFT - 12
          : clamp(p.x - VIEW_W * 0.38 + p.facing * 55, 0, WORLD_W - VIEW_W);
        cam.x = lerp(cam.x, targetX, Math.min(1, rawDt * 7.5));

        if (cam.shakeTime > 0) {
          cam.shakeTime = Math.max(0, cam.shakeTime - rawDt);
          const mag = cam.shakeAmp * (cam.shakeTime / Math.max(0.001, cam.shakeDur));
          const a = Math.random() * Math.PI * 2;
          cam.shakeX = Math.cos(a) * mag;
          cam.shakeY = Math.sin(a) * mag;
        } else {
          cam.shakeX = 0; cam.shakeY = 0; cam.shakeAmp = 0;
        }
      }

      function updateGame(rawDt) {
        state.elapsed += rawDt;
        if (state.pitFade > 0) state.pitFade = Math.max(0, state.pitFade - rawDt);

        // 背景孢子
        for (const s of state.bgSpores) {
          s.y -= s.vy * rawDt;
          if (s.y < -10) { s.y = VIEW_H - 40; s.x = Math.random() * VIEW_W; }
        }

        // 顿帧与重击快慢帧
        if (state.time.hitStop > 0) {
          state.time.hitStop = Math.max(0, state.time.hitStop - rawDt);
          updateCamera(rawDt);
          updateOrbs(rawDt);
          return;
        }

        if (state.time.slowTimer > 0) {
          state.time.slowTimer = Math.max(0, state.time.slowTimer - rawDt);
          const prog = 1 - state.time.slowTimer / Math.max(0.001, state.time.slowDur);
          state.time.scale = lerp(0.18, 1.0, Easing.easeInCubic(prog));
        } else {
          state.time.scale = 1.0;
        }

        const dt = rawDt * state.time.scale;
        if (state.mode === 'playing') {
          state.runTime += rawDt;
          if (state.bossGateClosed && state.bossGateDrop < 1) {
            state.bossGateDrop = Math.min(1, state.bossGateDrop + dt / 0.16);
            if (state.bossGateDrop >= 1 && !state.bossGateSlammed) {
              state.bossGateSlammed = true;
              addScreenShake(9, 0.28);
              AudioSys.playBossSlam();
              spawnDust(BOSS_ARENA_LEFT - 4, FLOOR_Y, 14);
            }
          }
          updatePlayer(dt);
          updateFragilesAndShrines(dt);
          updateCratesAndFruits(dt);
          updateEnemies(dt);
          updateBoss(dt);
          updateProjectilesAndWaves(dt);
        }

        updateVfx(dt);
        updateOrbs(rawDt);
        updateCamera(rawDt);
      }

      /* ============================================================
         9. 暗黑童话渲染系统（自动无缝切换自定义美术素材）
         ============================================================ */
      function drawBackground() {
        const bgAsset = AssetManager.get('bg_forest');
        if (bgAsset && bgAsset.canvas) {
          const scaleH = VIEW_H / Math.max(1, bgAsset.h);
          const drawW = Math.max(VIEW_W, bgAsset.w * scaleH);
          const scrollX = (state.camera.x * 0.28) % (drawW * 2);
          ctx.save();
          // 无缝镜像平铺
          for (let i = -1; i <= 2; i++) {
            const x = i * drawW - scrollX;
            if (x > VIEW_W + 40 || x + drawW < -40) continue;
            ctx.save();
            if (Math.abs(i) % 2 === 1) {
              ctx.translate(x + drawW, 0);
              ctx.scale(-1, 1);
              ctx.drawImage(bgAsset.canvas, 0, 0, drawW + 1, VIEW_H);
            } else {
              ctx.drawImage(bgAsset.canvas, x, 0, drawW + 1, VIEW_H);
            }
            ctx.restore();
          }
          ctx.fillStyle = 'rgba(5, 11, 16, 0.28)';
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
          ctx.restore();
        } else {
          // 默认暗黑童话森林遗迹多层视差
          const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
          sky.addColorStop(0, '#071118');
          sky.addColorStop(0.55, '#0f222c');
          sky.addColorStop(1, '#08131a');
          ctx.fillStyle = sky;
          ctx.fillRect(-30, -30, VIEW_W + 60, VIEW_H + 60);

          // 体积光束
          ctx.save();
          for (let i = 0; i < 4; i++) {
            const bx = ((i * 340 - state.camera.x * 0.14) % (VIEW_W + 360) + (VIEW_W + 360)) % (VIEW_W + 360) - 120;
            const g = ctx.createLinearGradient(bx, 0, bx + 90, VIEW_H);
            g.addColorStop(0, 'rgba(120, 220, 225, 0.085)');
            g.addColorStop(1, 'rgba(120, 220, 225, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(bx, 0); ctx.lineTo(bx + 75, 0);
            ctx.lineTo(bx + 185, VIEW_H); ctx.lineTo(bx + 55, VIEW_H);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();

          // 远景古树与巨型古铜吊钟剪影
          const farShift = state.camera.x * 0.22;
          ctx.fillStyle = '#09151d';
          for (let i = 0; i < 16; i++) {
            const tx = ((i * 155 - farShift) % (VIEW_W + 280) + (VIEW_W + 280)) % (VIEW_W + 280) - 100;
            const tw = 26 + (i % 3) * 14;
            ctx.fillRect(tx, 0, tw, VIEW_H);
            if (i % 4 === 2) {
              // 远景悬垂古铜钟
              ctx.strokeStyle = '#182c36';
              ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(tx + tw + 44, 0); ctx.lineTo(tx + tw + 44, 115); ctx.stroke();
              ctx.fillStyle = '#10212b';
              ctx.beginPath();
              ctx.arc(tx + tw + 44, 145, 28, Math.PI, 0);
              ctx.lineTo(tx + tw + 78, 185);
              ctx.lineTo(tx + tw + 10, 185);
              ctx.closePath();
              ctx.fill();
              ctx.fillStyle = '#09151d';
            }
          }
        }

        // 漂浮发光微光孢子
        for (const s of state.bgSpores) {
          const sx = s.x + Math.sin(state.elapsed * 1.4 + s.phase) * 12;
          ctx.fillStyle = `rgba(186, 250, 245, ${s.alpha})`;
          ctx.beginPath();
          ctx.arc(sx, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawTerrainAndGates() {
        const viewL = state.camera.x - 100;
        const viewR = state.camera.x + VIEW_W + 100;

        const groundTile = AssetManager.get('tile_ground');
        const solidTile = AssetManager.get('tile_solid');
        const stairTile = AssetManager.get('tile_stair');
        const suspendTile = AssetManager.get('tile_suspend');
        const onewayTile = AssetManager.get('tile_oneway');
        const fragileTile = AssetManager.get('tile_fragile');
        const shrineTile = AssetManager.get('tile_shrine');

        // 1. 实心平地、独立高台、四级石阶、悬浮跳台与单向铁艺踏板
        for (const pl of state.platforms) {
          const cullW = pl.stairRoot ? 196 : pl.w;
          if (pl.x + cullW < viewL || pl.x > viewR) continue;

          if (pl.type === 'oneway') {
            if (onewayTile && onewayTile.canvas) {
              ctx.drawImage(onewayTile.canvas, pl.x - 4, pl.y - 3, pl.w + 8, Math.max(24, pl.h * 2.2));
            } else {
              ctx.fillStyle = '#1d2d37';
              ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
              ctx.strokeStyle = '#64838d';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(pl.x, pl.y, pl.w, pl.h);
              ctx.fillStyle = '#99d5de';
              ctx.fillRect(pl.x + 2, pl.y, pl.w - 4, 2.5);
              ctx.strokeStyle = 'rgba(130, 170, 180, 0.45)';
              ctx.lineWidth = 1.2;
              for (let gx = pl.x + 16; gx < pl.x + pl.w - 10; gx += 22) {
                ctx.beginPath(); ctx.moveTo(gx, pl.y + 2); ctx.lineTo(gx, pl.y + pl.h); ctx.stroke();
              }
            }
          } else if (pl.stair) {
            if (stairTile && stairTile.canvas) {
              if (pl.stairRoot) ctx.drawImage(stairTile.canvas, pl.x - 4, FLOOR_Y - 90, 192, 94);
            } else {
              const grad = ctx.createLinearGradient(0, pl.y, 0, pl.y + pl.h);
              grad.addColorStop(0, '#364d53'); grad.addColorStop(1, '#142026');
              ctx.fillStyle = grad;
              ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
              ctx.fillStyle = '#52785c'; ctx.fillRect(pl.x, pl.y, pl.w, 5);
              ctx.fillStyle = '#8ec098'; ctx.fillRect(pl.x + 1, pl.y, pl.w - 2, 2);
              ctx.strokeStyle = '#0f1720'; ctx.lineWidth = 1.6;
              ctx.strokeRect(pl.x, pl.y, pl.w, pl.h);
            }
          } else {
            if (pl.suspended && suspendTile && suspendTile.canvas) {
              const aspectH = Math.max(pl.h + 18, (suspendTile.h / Math.max(1, suspendTile.w)) * pl.w);
              ctx.drawImage(suspendTile.canvas, pl.x - 6, pl.y - 4, pl.w + 12, Math.min(aspectH, 92));
            } else if (pl.ground && groundTile && groundTile.canvas) {
              const grad = ctx.createLinearGradient(0, pl.y, 0, pl.y + Math.min(pl.h, 150));
              grad.addColorStop(0, '#1a2a30'); grad.addColorStop(1, '#080e14');
              ctx.fillStyle = grad;
              ctx.fillRect(pl.x, pl.y + 10, pl.w, Math.max(0, pl.h - 10));

              const tileH = Math.max(pl.h + 6, 116);
              const segW = Math.max(140, Math.round((groundTile.w / Math.max(1, groundTile.h)) * tileH));
              ctx.save();
              ctx.beginPath();
              ctx.rect(pl.x - 2, pl.y - 10, pl.w + 4, pl.h + 24);
              ctx.clip();
              for (let tx = pl.x; tx < pl.x + pl.w; tx += segW - 4) {
                ctx.drawImage(groundTile.canvas, tx, pl.y - 5, segW, tileH);
              }
              ctx.restore();
            } else if (!pl.ground && solidTile && solidTile.canvas) {
              const aspectH = Math.max(pl.h + 14, (solidTile.h / Math.max(1, solidTile.w)) * pl.w);
              ctx.drawImage(solidTile.canvas, pl.x - 5, pl.y - 4, pl.w + 10, Math.min(aspectH, 68));
            } else {
              const grad = ctx.createLinearGradient(0, pl.y, 0, pl.y + Math.min(pl.h, 120));
              grad.addColorStop(0, '#33494f'); grad.addColorStop(0.28, '#203138'); grad.addColorStop(1, '#0e171d');
              ctx.fillStyle = grad;
              ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
              ctx.strokeStyle = '#121e24'; ctx.lineWidth = 1.5;
              for (let sx = pl.x + 48; sx < pl.x + pl.w - 12; sx += 56) {
                ctx.beginPath();
                ctx.moveTo(sx, pl.y + 4); ctx.lineTo(sx - 6, pl.y + 24);
                ctx.lineTo(sx + 4, pl.y + Math.min(pl.h, 58));
                ctx.stroke();
              }
              ctx.fillStyle = '#4c7056'; ctx.fillRect(pl.x, pl.y, pl.w, 6);
              ctx.fillStyle = '#84b38e'; ctx.fillRect(pl.x + 2, pl.y, pl.w - 4, 2);
              ctx.strokeStyle = '#101820'; ctx.lineWidth = 1.8;
              ctx.strokeRect(pl.x, pl.y, pl.w, pl.h);
            }
          }
        }

        // 2. 易碎再生地块
        for (const fr of state.fragiles) {
          if (fr.x + fr.w < viewL || fr.x > viewR) continue;
          ctx.save();
          if (fr.state === 'broken') {
            const prog = 1 - fr.timer / 2.6;
            ctx.strokeStyle = `rgba(103, 232, 249, ${0.28 + prog * 0.45})`;
            ctx.setLineDash([6, 5]);
            ctx.lineWidth = 1.6;
            ctx.strokeRect(fr.x, fr.y, fr.w, fr.h);
            ctx.fillStyle = 'rgba(103, 232, 249, 0.14)';
            ctx.fillRect(fr.x, fr.y, fr.w * prog, fr.h);
          } else {
            const jx = fr.state === 'shaking' ? (Math.random() - 0.5) * 6 : 0;
            const jy = fr.state === 'shaking' ? (Math.random() - 0.5) * 3 : 0;
            if (fragileTile && fragileTile.canvas) {
              ctx.drawImage(fragileTile.canvas, fr.x + jx - 4, fr.y + jy - 4, fr.w + 8, Math.max(fr.h + 14, 38));
            } else {
              ctx.fillStyle = fr.state === 'shaking' ? '#3a545d' : '#2a3d45';
              ctx.fillRect(fr.x + jx, fr.y + jy, fr.w, fr.h);
              ctx.strokeStyle = fr.state === 'shaking' ? '#a5f3fc' : '#67e8f9';
              ctx.lineWidth = fr.state === 'shaking' ? 2.2 : 1.3;
              ctx.beginPath();
              ctx.moveTo(fr.x + jx + 22, fr.y + jy + 2);
              ctx.lineTo(fr.x + jx + fr.w * 0.48, fr.y + jy + fr.h * 0.65);
              ctx.lineTo(fr.x + jx + fr.w - 20, fr.y + jy + 4);
              ctx.stroke();
              ctx.strokeStyle = '#0e171f';
              ctx.strokeRect(fr.x + jx, fr.y + jy, fr.w, fr.h);
            }
          }
          ctx.restore();
        }

        // 3. 回血祭坛
        for (const sh of state.shrines) {
          if (sh.x + sh.w < viewL || sh.x - sh.w > viewR) continue;
          ctx.save();
          const active = sh.pool > 0;
          if (active) {
            const g = ctx.createRadialGradient(sh.x, sh.y - 18, 4, sh.x, sh.y - 18, 56);
            g.addColorStop(0, 'rgba(253, 224, 71, 0.36)');
            g.addColorStop(1, 'rgba(253, 224, 71, 0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(sh.x, sh.y - 18, 56, 0, Math.PI * 2); ctx.fill();
          }
          if (shrineTile && shrineTile.canvas) {
            const dw = 114;
            const dh = (shrineTile.h / Math.max(1, shrineTile.w)) * dw;
            ctx.globalAlpha = active ? 1 : 0.45;
            ctx.drawImage(shrineTile.canvas, sh.x - dw * 0.5, sh.y - dh + 10, dw, dh);
          } else {
            ctx.fillStyle = '#2a3c42';
            ctx.fillRect(sh.x - sh.w * 0.5, sh.y - 10, sh.w, 12);
            ctx.strokeStyle = active ? '#e6c687' : '#475569';
            ctx.lineWidth = 2;
            ctx.strokeRect(sh.x - sh.w * 0.5, sh.y - 10, sh.w, 12);
            // 发光治疗花朵
            for (const ox of [-24, 0, 24]) {
              ctx.fillStyle = active ? '#fef08a' : '#475569';
              ctx.beginPath(); ctx.arc(sh.x + ox, sh.y - 18, active ? 5 : 3.5, 0, Math.PI * 2); ctx.fill();
            }
          }
          ctx.fillStyle = active ? '#fde047' : '#94a3b8';
          ctx.font = '700 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(active ? (sh.fullOnce ? '满额回血祭坛' : `回血祭坛 (${Math.ceil(sh.pool)})`) : '充能中...', sh.x, sh.y - 34);
          ctx.restore();
        }

        // 4. Boss 房砸落石门
        if (state.bossGateClosed) {
          const bossGateAsset = AssetManager.get('gate_boss');
          const gateH = FLOOR_Y - 120;
          const dropEase = Easing.easeInQuad(clamp(state.bossGateDrop, 0, 1));
          const gateTopY = lerp(120 - gateH - 40, 120, dropEase);
          ctx.save();
          if (bossGateAsset && bossGateAsset.canvas) {
            const drawH = gateH + 10;
            const drawW = clamp((bossGateAsset.w / Math.max(1, bossGateAsset.h)) * drawH, 34, 92);
            ctx.drawImage(bossGateAsset.canvas, BOSS_ARENA_LEFT - drawW * 0.5 - 4, gateTopY - 4, drawW, drawH);
          } else {
            const gxGate = BOSS_ARENA_LEFT - 16, gwGate = 24;
            const gg = ctx.createLinearGradient(gxGate, gateTopY, gxGate + gwGate, gateTopY);
            gg.addColorStop(0, '#1e2b33'); gg.addColorStop(0.5, '#3b4e57'); gg.addColorStop(1, '#141d24');
            ctx.fillStyle = gg; ctx.fillRect(gxGate, gateTopY, gwGate, gateH);
            ctx.strokeStyle = '#0b1116'; ctx.lineWidth = 2; ctx.strokeRect(gxGate, gateTopY, gwGate, gateH);
            ctx.fillStyle = '#8f6b32';
            for (let ry = gateTopY + 36; ry < gateTopY + gateH - 20; ry += 68) ctx.fillRect(gxGate + 2, ry, gwGate - 4, 7);
          }
          ctx.restore();
        }

        // 5. 通关之门（封锁 / 开启双状态）
        const gx = 6925;
        const exitClosedAsset = AssetManager.get('gate_exit_closed');
        const exitOpenAsset = AssetManager.get('gate_exit_open');
        ctx.save();
        if (state.victoryGateOpen && exitOpenAsset && exitOpenAsset.canvas) {
          const pg = ctx.createRadialGradient(gx, FLOOR_Y - 64, 10, gx, FLOOR_Y - 64, 74);
          pg.addColorStop(0, 'rgba(254, 249, 195, 0.75)');
          pg.addColorStop(0.55, 'rgba(103, 232, 249, 0.42)');
          pg.addColorStop(1, 'rgba(56, 189, 248, 0)');
          ctx.fillStyle = pg;
          ctx.beginPath(); ctx.arc(gx, FLOOR_Y - 64, 74, 0, Math.PI * 2); ctx.fill();
          const dh = 152, dw = (exitOpenAsset.w / Math.max(1, exitOpenAsset.h)) * dh;
          ctx.drawImage(exitOpenAsset.canvas, gx - dw * 0.5, FLOOR_Y - dh + 4, dw, dh);
        } else if (!state.victoryGateOpen && exitClosedAsset && exitClosedAsset.canvas) {
          const dh = 152, dw = (exitClosedAsset.w / Math.max(1, exitClosedAsset.h)) * dh;
          ctx.drawImage(exitClosedAsset.canvas, gx - dw * 0.5, FLOOR_Y - dh + 4, dw, dh);
        } else {
          ctx.fillStyle = state.victoryGateOpen ? '#15343f' : '#111922';
          ctx.beginPath();
          ctx.moveTo(gx - 34, FLOOR_Y);
          ctx.lineTo(gx - 34, FLOOR_Y - 82);
          ctx.quadraticCurveTo(gx, FLOOR_Y - 134, gx + 34, FLOOR_Y - 82);
          ctx.lineTo(gx + 34, FLOOR_Y);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = state.victoryGateOpen ? '#fde047' : '#475569';
          ctx.lineWidth = 3; ctx.stroke();
          if (!state.victoryGateOpen) {
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
            for (const ox of [-16, 0, 16]) {
              ctx.beginPath(); ctx.moveTo(gx + ox, FLOOR_Y - 94); ctx.lineTo(gx + ox, FLOOR_Y); ctx.stroke();
            }
          } else {
            const pg = ctx.createRadialGradient(gx, FLOOR_Y - 54, 6, gx, FLOOR_Y - 54, 48);
            pg.addColorStop(0, '#fef9c3'); pg.addColorStop(0.5, 'rgba(103, 232, 249, 0.65)'); pg.addColorStop(1, 'rgba(56, 189, 248, 0)');
            ctx.fillStyle = pg;
            ctx.beginPath(); ctx.arc(gx, FLOOR_Y - 54, 48, 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.restore();
      }

      function drawProps() {
        const crateAsset = AssetManager.get('prop_crate');
        const potAsset = AssetManager.get('prop_pot');
        const fruitAsset = AssetManager.get('prop_fruit');

        for (const c of state.crates) {
          if (c.broken) continue;
          ctx.save();
          if (crateAsset && crateAsset.canvas) {
            const img = c.flash > 0 ? crateAsset.white : crateAsset.canvas;
            ctx.drawImage(img, c.x - c.w * 0.5 - 2, c.y - c.h - 2, c.w + 4, c.h + 4);
          } else {
            ctx.fillStyle = c.flash > 0 ? '#ffffff' : '#6c492d';
            ctx.fillRect(c.x - c.w * 0.5, c.y - c.h, c.w, c.h);
            ctx.strokeStyle = '#24170e'; ctx.lineWidth = 2;
            ctx.strokeRect(c.x - c.w * 0.5, c.y - c.h, c.w, c.h);
            ctx.beginPath();
            ctx.moveTo(c.x - c.w * 0.5, c.y - c.h); ctx.lineTo(c.x + c.w * 0.5, c.y);
            ctx.moveTo(c.x + c.w * 0.5, c.y - c.h); ctx.lineTo(c.x - c.w * 0.5, c.y);
            ctx.stroke();
          }
          ctx.restore();
        }

        for (const pot of state.pots) {
          if (pot.broken) continue;
          ctx.save();
          if (potAsset && potAsset.canvas) {
            const img = pot.flash > 0 ? potAsset.white : potAsset.canvas;
            ctx.drawImage(img, pot.x - pot.w * 0.55, pot.y - pot.h - 2, pot.w * 1.1, pot.h + 4);
          } else {
            ctx.fillStyle = pot.flash > 0 ? '#ffffff' : '#4a5d66';
            ctx.beginPath();
            ctx.ellipse(pot.x, pot.y - 13, 13, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#152028'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = pot.flash > 0 ? '#ffffff' : '#687f8a';
            ctx.fillRect(pot.x - 8, pot.y - 30, 16, 5);
          }
          ctx.restore();
        }

        for (const f of state.fruits) {
          const fy = f.y + Math.sin(f.bob) * 3;
          ctx.save();
          const g = ctx.createRadialGradient(f.x, fy, 1, f.x, fy, 18);
          g.addColorStop(0, '#ecfeff');
          g.addColorStop(0.5, 'rgba(74, 222, 128, 0.72)');
          g.addColorStop(1, 'rgba(74, 222, 128, 0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(f.x, fy, 18, 0, Math.PI * 2); ctx.fill();
          if (fruitAsset && fruitAsset.canvas) {
            const dh = 24, dw = (fruitAsset.w / Math.max(1, fruitAsset.h)) * dh;
            ctx.drawImage(fruitAsset.canvas, f.x - dw * 0.5, fy - dh * 0.5, dw, dh);
          } else {
            ctx.fillStyle = '#86efac';
            ctx.beginPath(); ctx.arc(f.x, fy, 6, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawMiniHpBar(x, y, w, hp, whiteHp, maxHp, shakeTimer) {
        const sx = shakeTimer > 0 ? Math.sin(state.elapsed * 95) * 3.5 : 0;
        const bx = x - w * 0.5 + sx;
        ctx.fillStyle = 'rgba(8, 14, 20, 0.85)';
        ctx.fillRect(bx - 1, y - 1, w + 2, 7);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx, y, w * clamp(whiteHp / maxHp, 0, 1), 5);
        ctx.fillStyle = '#e11d48';
        ctx.fillRect(bx, y, w * clamp(hp / maxHp, 0, 1), 5);
      }

      function drawSheetFrame(sheet, frameIdx, x, y, targetH, facing, isFlash) {
        if (!sheet || !sheet.frames || sheet.frames.length === 0) return false;
        const f = sheet.frames[frameIdx % sheet.frames.length];
        const drawH = targetH;
        const drawW = (f.w / Math.max(1, f.h)) * drawH;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(facing, 1);
        if (isFlash) {
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 12;
          ctx.drawImage(f.white, -drawW * 0.5, -drawH, drawW, drawH);
        } else {
          ctx.drawImage(f.canvas, -drawW * 0.5, -drawH, drawW, drawH);
        }
        ctx.restore();
        return true;
      }

      function drawEnemiesAndBoss() {
        for (const e of state.enemies) {
          if (e.dead) continue;
          ctx.save();
          // 底部锁锚果冻挤压变形
          let sx = 1, sy = 1;
          if (e.squashTimer > 0) {
            const prog = 1 - e.squashTimer / 0.40;
            const wave = Math.cos(prog * Math.PI * 2.5) * Math.exp(-prog * 3.2);
            sx = 1 - wave * 0.24;
            sy = 1 + wave * 0.26;
          }
          ctx.translate(e.x, e.y);
          ctx.scale(sx, sy);

          if (e.kind === 'beetle') {
            const sheet = AssetManager.get(e.aiState === 'charge' || e.aiState === 'windup' ? 'beetle_attack' : 'beetle_walk');
            const idx = Math.floor(e.animTime * 10);
            if (!drawSheetFrame(sheet, idx, 0, 0, 56, e.facing, e.flash > 0)) {
              ctx.scale(e.facing, 1);
              if (e.flash > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 14; }
              // 黑色底身与四足
              const walk = Math.sin(e.animTime * 12) * 3;
              ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#090d11';
              ctx.beginPath(); ctx.ellipse(0, -14, 24, 12, 0, 0, Math.PI * 2); ctx.fill();
              for (const lx of [-16, -6, 6, 15]) {
                ctx.fillRect(lx - 2, -8, 4, 8 + (lx > 0 ? walk : -walk) * 0.5);
              }
              // 苔石穹顶甲壳
              ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#4a6566';
              ctx.beginPath(); ctx.arc(0, -16, 25, Math.PI, 0); ctx.closePath(); ctx.fill();
              ctx.strokeStyle = '#101a20'; ctx.lineWidth = 2; ctx.stroke();
              // 青苔与发光孢子花
              if (e.flash <= 0) {
                ctx.fillStyle = '#5c8459';
                ctx.beginPath(); ctx.ellipse(-7, -38, 12, 5, -0.2, 0, Math.PI * 2); ctx.fill();
                const budGlow = e.aiState === 'windup' ? '#fde047' : '#e0f2fe';
                ctx.fillStyle = budGlow;
                ctx.beginPath(); ctx.arc(-11, -48, 3.8, 0, Math.PI * 2); ctx.arc(-2, -45, 3, 0, Math.PI * 2); ctx.fill();
              }
              // 表情（正常圆眼 / 受击 > <）
              ctx.strokeStyle = e.flash > 0 ? '#0f172a' : '#e0f2fe';
              ctx.fillStyle = e.flash > 0 ? '#0f172a' : '#e0f2fe';
              if (e.hurtExpr > 0) {
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(8, -17); ctx.lineTo(13, -14); ctx.lineTo(8, -11);
                ctx.moveTo(20, -17); ctx.lineTo(15, -14); ctx.lineTo(20, -11);
                ctx.stroke();
              } else {
                ctx.beginPath(); ctx.arc(11, -14, 2.8, 0, Math.PI * 2); ctx.arc(19, -14, 2.5, 0, Math.PI * 2); ctx.fill();
              }
            }
          } else {
            const sheet = AssetManager.get(e.aiState === 'charge' ? 'wisp_attack' : 'wisp_walk');
            const idx = Math.floor(e.animTime * 10);
            if (!drawSheetFrame(sheet, idx, 0, 0, 58, e.facing, e.flash > 0)) {
              ctx.scale(e.facing, 1);
              if (e.flash > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 14; }
              const flap = Math.sin(e.animTime * 11) * 10;
              // 破损蛾翼
              ctx.fillStyle = e.flash > 0 ? '#ffffff' : 'rgba(122, 152, 158, 0.72)';
              ctx.beginPath(); ctx.moveTo(-4, -26); ctx.quadraticCurveTo(-26, -42 + flap, -22, -16); ctx.closePath(); ctx.fill();
              ctx.beginPath(); ctx.moveTo(4, -26); ctx.quadraticCurveTo(24, -40 - flap, 20, -16); ctx.closePath(); ctx.fill();
              // 古铜残铃壳
              ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#6c624b';
              ctx.beginPath(); ctx.arc(0, -24, 15, Math.PI, 0); ctx.lineTo(17, -10); ctx.lineTo(-17, -10); ctx.closePath(); ctx.fill();
              ctx.strokeStyle = '#161b20'; ctx.lineWidth = 1.8; ctx.stroke();
              // 钟内蓄力光点
              ctx.fillStyle = e.aiState === 'charge' ? '#fde047' : '#a5f3fc';
              ctx.beginPath(); ctx.arc(0, -11, e.aiState === 'charge' ? 6 : 4, 0, Math.PI * 2); ctx.fill();
            }
          }
          ctx.restore();

          if (e.hp < e.maxHp) {
            drawMiniHpBar(e.x, e.y - e.h - 14, 46, e.hp, e.whiteHp, e.maxHp, e.hpShake);
          }
        }

        // Boss：朽钟守林巨像
        const b = state.boss;
        if (b && !b.dead) {
          ctx.save();
          ctx.translate(b.x, b.y);
          const isAtk = b.aiState.includes('windup') || b.aiState.includes('strike');
          const bSheet = AssetManager.get(isAtk ? 'boss_attack' : 'boss_walk');
          const idx = Math.floor(b.animTime * (isAtk ? 12 : 8));
          if (!drawSheetFrame(bSheet, idx, 0, 0, 152, b.facing, b.flash > 0)) {
            ctx.scale(b.facing, 1);
            if (b.flash > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 18; }
            const bob = Math.sin(b.animTime * 5) * 3;
            // 披风与苔石重甲身躯
            ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#1b2b33';
            ctx.beginPath();
            ctx.moveTo(-36, 0); ctx.lineTo(-42, -88 + bob); ctx.lineTo(42, -88 + bob); ctx.lineTo(36, 0);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#091015'; ctx.lineWidth = 2.5; ctx.stroke();

            // 巨型古铜钟盔
            ctx.fillStyle = b.flash > 0 ? '#ffffff' : (b.phase === 2 ? '#8f723f' : '#6f5c3a');
            ctx.beginPath();
            ctx.arc(0, -96 + bob, 32, Math.PI, 0);
            ctx.lineTo(38, -66 + bob); ctx.lineTo(-38, -66 + bob);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // 发光巨眼
            ctx.fillStyle = b.phase === 2 ? '#fde047' : '#67e8f9';
            ctx.beginPath(); ctx.arc(12, -74 + bob, 4.5, 0, Math.PI * 2); ctx.arc(24, -74 + bob, 4, 0, Math.PI * 2); ctx.fill();

            // 荆棘大剑（蓄力高举）
            ctx.save();
            ctx.translate(22, -62 + bob);
            const swordAng = b.aiState === 'slam_windup' ? -2.25 : (b.aiState === 'slam_strike' ? 0.55 : (b.aiState === 'sweep_windup' ? -1.4 : 0.2));
            ctx.rotate(swordAng);
            ctx.fillStyle = b.aiState.includes('windup') ? '#fef08a' : '#8da3ad';
            ctx.fillRect(0, -6, 86, 12);
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.strokeRect(0, -6, 86, 12);
            ctx.restore();
          }
          ctx.restore();
        }
      }

      function drawPlayerSprite(p, alpha = 1, tint = null) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.scale(p.squashX, p.squashY);

        let sheetKey = p.forceSheetKey || 'player_idle';
        let frameIdx = Number.isInteger(p.forceFrameIdx) ? p.forceFrameIdx : Math.floor(p.animTime * 8);
        if (!p.forceSheetKey) {
          if (p.atkActive) {
            sheetKey = 'player_attack';
            const cfg = COMBO_CFG[p.atkStep];
            const prog = p.atkPhase === 'windup'
              ? (p.atkTimer / cfg.windup) * 0.3
              : (p.atkPhase === 'slash' ? 0.3 + (p.atkTimer / cfg.slash) * 0.35 : 0.65 + (p.atkTimer / cfg.recovery) * 0.35);
            frameIdx = clamp(Math.floor(prog * 10), 0, 9);
          } else if (Math.abs(p.vx) > 25) {
            sheetKey = 'player_run';
            frameIdx = Math.floor(p.animTime * 14);
          }
        }

        const sheet = AssetManager.get(sheetKey) || (tint ? (AssetManager.get('player_run') || AssetManager.get('player_idle')) : null);
        if (sheet && sheet.frames && sheet.frames.length > 0) {
          drawSheetFrame(sheet, frameIdx, 0, 0, 74, p.facing, Boolean(tint) || p.hurtFlash > 0.14);
          ctx.restore();
          return;
        }

        // 内置暗黑童话黑帽披风剑客矢量绘制（未导入图片时，tint 模式下同样绘制纯白剪影）
        ctx.scale(p.facing, 1);
        if (tint) {
          ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
          ctx.shadowBlur = 10;
        }
        const runBob = Math.abs(p.vx) > 25 && p.onGround ? Math.abs(Math.sin(p.animTime * 14)) * 3.5 : Math.sin(p.animTime * 3.5) * 1.5;

        // 飘动蓝灰双尾围巾
        ctx.fillStyle = tint || '#586d7a';
        const wave = Math.sin(p.animTime * 10) * 5;
        ctx.beginPath();
        ctx.moveTo(-4, -36 - runBob);
        ctx.quadraticCurveTo(-24, -38 - runBob + wave, -34, -29 - runBob - wave * 0.5);
        ctx.lineTo(-10, -28 - runBob);
        ctx.closePath(); ctx.fill();

        // 双腿
        const legSwing = Math.abs(p.vx) > 25 ? Math.sin(p.animTime * 16) * 8 : 0;
        ctx.fillStyle = tint || '#090d11';
        ctx.fillRect(-7 + legSwing * 0.5, -14, 5, 14);
        ctx.fillRect(2 - legSwing * 0.5, -14, 5, 14);

        // 破损米白斗篷
        ctx.fillStyle = tint || '#c9c5b2';
        ctx.beginPath();
        ctx.moveTo(-10, -36 - runBob);
        ctx.lineTo(10, -36 - runBob);
        ctx.lineTo(15, -11 - runBob);
        ctx.lineTo(5, -14 - runBob);
        ctx.lineTo(-2, -10 - runBob);
        ctx.lineTo(-16, -12 - runBob);
        ctx.closePath(); ctx.fill();
        if (!tint) { ctx.strokeStyle = '#141c22'; ctx.lineWidth = 1.6; ctx.stroke(); }

        // 黑色头部与发光锐眼
        ctx.fillStyle = tint || '#070a0e';
        ctx.beginPath(); ctx.arc(1, -43 - runBob, 11, 0, Math.PI * 2); ctx.fill();
        if (!tint) {
          ctx.fillStyle = '#d6fcff';
          ctx.shadowColor = '#67e8f9'; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.ellipse(4, -43 - runBob, 2.3, 3.2, 0, 0, Math.PI * 2); ctx.ellipse(9.5, -43 - runBob, 2, 3, 0, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
        }

        // 弯尖黑帽与古铜帽带
        ctx.fillStyle = tint || '#1b222a';
        ctx.beginPath();
        ctx.moveTo(-19, -48 - runBob);
        ctx.quadraticCurveTo(2, -55 - runBob, 22, -49 - runBob);
        ctx.quadraticCurveTo(3, -44 - runBob, -19, -48 - runBob);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-9, -49 - runBob);
        ctx.quadraticCurveTo(-14, -67 - runBob, -2, -70 - runBob);
        ctx.quadraticCurveTo(-8, -73 - runBob, -18, -64 - runBob);
        ctx.quadraticCurveTo(-4, -63 - runBob, 9, -49 - runBob);
        ctx.closePath(); ctx.fill();
        if (!tint) { ctx.strokeStyle = '#0a0f14'; ctx.lineWidth = 1.5; ctx.stroke(); }

        // 暗钢长剑（攻击时身前挥舞，平时斜背）
        if (!tint) {
          ctx.save();
          if (p.atkActive) {
            ctx.translate(6, -30 - runBob);
            const cfg = COMBO_CFG[p.atkStep];
            let ang = -0.6;
            if (p.atkPhase === 'windup') ang = p.atkStep === 2 ? 1.15 : -2.15;
            else if (p.atkPhase === 'slash') {
              const t = Easing.easeOutExpo(clamp(p.atkTimer / cfg.slash, 0, 1));
              ang = p.atkStep === 2 ? lerp(1.15, -1.85, t) : lerp(-2.15, 0.95, t);
            } else {
              ang = p.atkStep === 2 ? -1.45 : 0.75;
            }
            ctx.rotate(ang);
            ctx.fillStyle = p.atkStep === 3 ? '#fef08a' : '#cbd5e1';
            ctx.fillRect(0, -2.5, 44, 5);
            ctx.fillStyle = '#b48a4e';
            ctx.fillRect(-3, -7, 5, 14);
          } else {
            ctx.translate(-8, -32 - runBob);
            ctx.rotate(-2.3);
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(-10, -2, 34, 4);
          }
          ctx.restore();
        }
        ctx.restore();
      }

      // 冲刺纯白图片剪影拖尾（独立绘制在主角身后）
      function drawAfterimages() {
        const dashSingle = AssetManager.get('player_dash');
        for (const g of state.vfx.afterimages) {
          const ratio = clamp(g.life / g.maxLife, 0, 1);
          const alpha = Easing.easeOutQuad(ratio) * 0.72;

          if (dashSingle && dashSingle.white) {
            const drawH = 74;
            const drawW = (dashSingle.w / Math.max(1, dashSingle.h)) * drawH;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(g.x, g.y);
            ctx.scale(g.facing, 1);
            ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
            ctx.shadowBlur = 10;
            ctx.drawImage(dashSingle.white, -drawW * 0.5, -drawH, drawW, drawH);
            ctx.restore();
          } else {
            drawPlayerSprite({
              ...state.player,
              x: g.x,
              y: g.y,
              vx: g.facing * 300,
              facing: g.facing,
              animTime: g.animTime ?? state.player.animTime,
              forceSheetKey: g.sheetKey,
              forceFrameIdx: g.frameIdx,
              atkActive: false,
              squashX: 1,
              squashY: 1
            }, alpha, '#ffffff');
          }
        }
      }

      function drawVfxWorld() {
        const v = state.vfx;

        // 弯月刀光
        for (const s of v.slashes) {
          const a = clamp(s.life / s.maxLife, 0, 1);
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.scale(s.facing, s.step === 2 ? -1 : 1);
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = s.step === 3 ? `rgba(253, 224, 71, ${a})` : `rgba(103, 232, 249, ${a})`;
          ctx.lineWidth = (s.step === 3 ? 16 : 11) * a;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(0, 0, s.radius, -1.35, 1.05);
          ctx.stroke();
          ctx.strokeStyle = `rgba(240, 253, 255, ${a})`;
          ctx.lineWidth = 4 * a;
          ctx.beginPath();
          ctx.arc(0, 0, s.radius - 2, -1.2, 0.9);
          ctx.stroke();
          ctx.restore();
        }

        // 残铃浮灵光弹（含弹反金青尾迹）
        for (const pr of state.projectiles) {
          ctx.save();
          if (pr.deflected && pr.trail && pr.trail.length >= 2) {
            ctx.lineCap = 'round';
            for (let t = 1; t < pr.trail.length; t++) {
              const frac = t / (pr.trail.length - 1);
              ctx.strokeStyle = `rgba(253, 224, 71, ${frac * 0.85})`;
              ctx.lineWidth = pr.r * 1.45 * frac;
              ctx.beginPath();
              ctx.moveTo(pr.trail[t - 1].x, pr.trail[t - 1].y);
              ctx.lineTo(pr.trail[t].x, pr.trail[t].y);
              ctx.stroke();
            }
          }
          const g = ctx.createRadialGradient(pr.x, pr.y, 1, pr.x, pr.y, pr.r * (pr.deflected ? 3.0 : 2.4));
          g.addColorStop(0, '#ffffff');
          g.addColorStop(0.42, pr.deflected ? '#fde047' : '#67e8f9');
          g.addColorStop(1, pr.deflected ? 'rgba(250, 204, 21, 0)' : 'rgba(56, 189, 248, 0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r * (pr.deflected ? 3.0 : 2.4), 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        // Boss 地面震荡波
        for (const sw of state.shockwaves) {
          ctx.save();
          ctx.translate(sw.x, sw.y);
          ctx.scale(sw.dir, 1);
          const g = ctx.createLinearGradient(0, -sw.h, 0, 0);
          g.addColorStop(0, '#ecfeff');
          g.addColorStop(0.5, '#38bdf8');
          g.addColorStop(1, 'rgba(56, 189, 248, 0.15)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(-22, 0);
          ctx.quadraticCurveTo(4, -sw.h * 1.25, 22, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // 尘土与碎石
        for (const d of v.dust) {
          ctx.globalAlpha = clamp(d.life / d.maxLife, 0, 1);
          ctx.fillStyle = d.color;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const d of v.debris) {
          ctx.save();
          ctx.globalAlpha = clamp(d.life / d.maxLife, 0, 1);
          ctx.translate(d.x, d.y);
          ctx.rotate(d.rot);
          ctx.fillStyle = d.color;
          ctx.fillRect(-d.size * 0.5, -d.size * 0.5, d.size, d.size * 0.75);
          ctx.restore();
        }

        // 冲击光圈
        for (const r of v.rings) {
          const t = 1 - r.life / r.maxLife;
          const rad = lerp(r.r0, r.r1, Easing.easeOutCubic(t));
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = r.color;
          ctx.globalAlpha = 1 - t;
          ctx.lineWidth = Math.max(0.6, r.w0 * (1 - t));
          ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        // 火花
        for (const s of v.sparks) {
          const a = clamp(s.life / s.maxLife, 0, 1);
          const ang = Math.atan2(s.vy, s.vx);
          ctx.save();
          ctx.strokeStyle = s.color;
          ctx.globalAlpha = a;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - Math.cos(ang) * s.len, s.y - Math.sin(ang) * s.len);
          ctx.stroke();
          ctx.restore();
        }

        // 伤害 / 回血 / 弹反数字
        for (const n of v.dmgNums) {
          const a = clamp((n.life / n.maxLife) * 1.4, 0, 1);
          ctx.save();
          ctx.globalAlpha = a;
          ctx.font = (n.isHeavy || n.isParry) ? '900 22px ui-monospace, monospace' : '800 15px ui-monospace, monospace';
          ctx.textAlign = 'center';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#0f172a';
          ctx.strokeText(n.text, n.x, n.y);
          ctx.fillStyle = n.isParry ? '#67e8f9' : (n.isHeal ? '#86efac' : (n.isHeavy ? '#fde047' : '#fef3c7'));
          ctx.fillText(n.text, n.x, n.y);
          ctx.restore();
        }

        // 散落阶段的金币光点（世界坐标）
        for (const o of state.orbs) {
          if (o.phase === 'fly') continue;
          const g = ctx.createRadialGradient(o.wx, o.wy, 1, o.wx, o.wy, 11);
          g.addColorStop(0, '#ffffff');
          g.addColorStop(0.45, '#fde047');
          g.addColorStop(1, 'rgba(250, 204, 21, 0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(o.wx, o.wy, 11, 0, Math.PI * 2); ctx.fill();
        }
      }

      function drawScreenHudAndEffects() {
        const p = state.player;

        // 1. 飞行阶段的金币光点（屏幕坐标）
        for (const o of state.orbs) {
          if (o.phase !== 'fly') continue;
          if (!Number.isFinite(o.scrX) || !Number.isFinite(o.scrY)) continue;
          if (o.trail && o.trail.length >= 2) {
            ctx.save();
            ctx.lineCap = 'round';
            for (let t = 1; t < o.trail.length; t++) {
              const frac = t / (o.trail.length - 1);
              ctx.strokeStyle = `rgba(253, 224, 71, ${frac * 0.78})`;
              ctx.lineWidth = 5.5 * frac;
              ctx.beginPath();
              ctx.moveTo(o.trail[t - 1].x, o.trail[t - 1].y);
              ctx.lineTo(o.trail[t].x, o.trail[t].y);
              ctx.stroke();
            }
            ctx.restore();
          }
          const g = ctx.createRadialGradient(o.scrX, o.scrY, 1, o.scrX, o.scrY, 12);
          g.addColorStop(0, '#ffffff');
          g.addColorStop(0.45, '#fde047');
          g.addColorStop(1, 'rgba(250, 204, 21, 0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(o.scrX, o.scrY, 12, 0, Math.PI * 2); ctx.fill();
        }

        // 2. 低血量（<25）暗红脉动暗角 & 受击红闪
        if ((p.hp > 0 && p.hp < 25) || p.hurtFlash > 0) {
          const pulse = p.hp < 25 ? (0.28 + 0.18 * Math.sin(state.elapsed * 7.5)) : 0;
          const hitA = p.hurtFlash > 0 ? (p.hurtFlash / 0.28) * 0.36 : 0;
          const alpha = Math.min(0.65, Math.max(pulse, hitA));
          const vg = ctx.createRadialGradient(VIEW_W * 0.5, VIEW_H * 0.5, VIEW_H * 0.28, VIEW_W * 0.5, VIEW_H * 0.5, VIEW_W * 0.65);
          vg.addColorStop(0, 'rgba(185, 28, 28, 0)');
          vg.addColorStop(1, `rgba(185, 28, 28, ${alpha})`);
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        }

        // 3. 左上角复古鎏金 HUD（血条 + 金币 + 冲刺状态）
        const shakeX = p.hpShake > 0 ? Math.sin(state.elapsed * 90) * 4 : 0;
        ctx.save();
        ctx.translate(16 + shakeX, 14);
        // 血条底板
        ctx.fillStyle = 'rgba(8, 18, 24, 0.82)';
        ctx.strokeStyle = 'rgba(223, 192, 136, 0.72)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(0, 0, 224, 24, 7); ctx.fill(); ctx.stroke();

        // 白条残血 + 绯红真血
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(6, 5, 212 * clamp(p.whiteHp / p.maxHp, 0, 1), 14);
        const hg = ctx.createLinearGradient(6, 0, 218, 0);
        hg.addColorStop(0, '#9f1239'); hg.addColorStop(1, '#f43f5e');
        ctx.fillStyle = hg;
        ctx.fillRect(6, 5, 212 * clamp(p.hp / p.maxHp, 0, 1), 14);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '800 11px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`HP ${Math.ceil(p.hp)} / ${p.maxHp}`, 112, 16);

        // 金币胶囊
        const gScale = 1 + (state.goldPulse / 0.16) * 0.18;
        ctx.save();
        ctx.translate(0, 32);
        ctx.scale(gScale, gScale);
        ctx.fillStyle = 'rgba(8, 18, 24, 0.82)';
        ctx.strokeStyle = state.goldPulse > 0 ? '#fde047' : 'rgba(223, 192, 136, 0.65)';
        ctx.beginPath(); ctx.roundRect(0, 0, 108, 26, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#facc15';
        ctx.beginPath(); ctx.arc(18, 13, 7, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#fef08a';
        ctx.font = '800 13px ui-monospace, monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${state.gold}`, 33, 18);
        ctx.restore();

        // 冲刺冷却与连段提示
        ctx.fillStyle = 'rgba(8, 18, 24, 0.78)';
        ctx.strokeStyle = p.dashCd <= 0 ? 'rgba(103, 232, 249, 0.6)' : 'rgba(148, 163, 184, 0.3)';
        ctx.beginPath(); ctx.roundRect(116, 32, 108, 26, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = p.dashCd <= 0 ? '#67e8f9' : '#94a3b8';
        ctx.font = '700 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.dashCd <= 0 ? '冲刺就绪' : `冲刺 ${p.dashCd.toFixed(1)}s`, 170, 49);
        ctx.restore();

        // 4. 区域名称指示
        const zoneName = p.x < 1760 ? '区域 1 · 遗迹入口' : (p.x < 3040 ? '区域 2 · 断桥跳台' : (p.x < 5450 ? '区域 3 · 密林长廊' : '区域 4 · 钟楼祭坛'));
        ctx.save();
        ctx.fillStyle = 'rgba(8, 18, 24, 0.72)';
        ctx.strokeStyle = 'rgba(223, 192, 136, 0.45)';
        ctx.beginPath(); ctx.roundRect(VIEW_W - 166, 14, 150, 26, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#e6c687';
        ctx.font = '700 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(zoneName, VIEW_W - 91, 31);
        ctx.restore();

        // 5. Boss 专属血条
        const b = state.boss;
        if (b && b.active && !b.dead) {
          const bw = 460;
          const bx = (VIEW_W - bw) * 0.5 + (b.hpShake > 0 ? Math.sin(state.elapsed * 95) * 4 : 0);
          const by = VIEW_H - 46;
          ctx.save();
          ctx.fillStyle = 'rgba(8, 16, 22, 0.88)';
          ctx.strokeStyle = b.phase === 2 ? '#fde047' : 'rgba(223, 192, 136, 0.75)';
          ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.roundRect(bx - 6, by - 22, bw + 12, 42, 10); ctx.fill(); ctx.stroke();
          ctx.fillStyle = b.phase === 2 ? '#fef08a' : '#e6c687';
          ctx.font = '800 12px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(b.phase === 2 ? '朽钟守林巨像 · 二阶段共鸣' : '朽钟守林巨像', bx + 2, by - 6);
          ctx.textAlign = 'right';
          ctx.fillText(`${Math.ceil(b.hp)} / ${b.maxHp}`, bx + bw - 2, by - 6);

          ctx.fillStyle = '#1e293b';
          ctx.fillRect(bx, by, bw, 12);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(bx, by, bw * clamp(b.whiteHp / b.maxHp, 0, 1), 12);
          ctx.fillStyle = b.phase === 2 ? '#f59e0b' : '#dc2626';
          ctx.fillRect(bx, by, bw * clamp(b.hp / b.maxHp, 0, 1), 12);
          ctx.restore();
        }

        // 6. 坠落沟壑瞬黑遮罩
        if (state.pitFade > 0) {
          ctx.fillStyle = `rgba(0, 0, 0, ${clamp(state.pitFade / 0.35, 0, 1) * 0.88})`;
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        }
      }

      function render() {
        ctx.clearRect(0, 0, VIEW_W, VIEW_H);
        drawBackground();

        ctx.save();
        ctx.translate(-Math.round(state.camera.x) + state.camera.shakeX, state.camera.shakeY);
        drawTerrainAndGates();
        drawProps();
        drawEnemiesAndBoss();
        drawAfterimages();
        const p = state.player;
        const blink = p.hurtInvuln > 0 && Math.floor(state.elapsed * 20) % 2 === 0;
        drawPlayerSprite(p, blink ? 0.45 : 1);
        drawVfxWorld();
        ctx.restore();

        drawScreenHudAndEffects();
      }

      /* ============================================================
         10. 事件绑定与启动主循环
         ============================================================ */
      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
        if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyK') {
          if (!keys.jumpHeld) triggerJump();
          keys.jumpHeld = true;
        }
        if (e.code === 'KeyJ' && !e.repeat) triggerAttack();
        if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyL') && !e.repeat) triggerDash();
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
        if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyK') keys.jumpHeld = false;
      });

      window.addEventListener('blur', () => {
        keys.left = keys.right = keys.down = keys.jumpHeld = false;
      });

      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (e.button === 0) triggerAttack();
        if (e.button === 2) triggerDash();
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // 工具栏按钮
      document.getElementById('btnSound').addEventListener('click', (e) => {
        AudioSys.enabled = !AudioSys.enabled;
        e.currentTarget.textContent = AudioSys.enabled ? '🔊 音效：开' : '🔇 音效：关';
        if (AudioSys.enabled) AudioSys.unlock();
      });

      document.getElementById('btnAssets').addEventListener('click', () => {
        const panel = document.getElementById('assetPanel');
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) AssetManager.renderGrid();
      });

      document.getElementById('btnBossWarp').addEventListener('click', warpToBossCorridor);
      document.getElementById('btnRestart').addEventListener('click', () => buildLevel(true));

      document.getElementById('btnModalPrimary').addEventListener('click', () => {
        if (state.mode === 'dead') respawnAtCheckpoint();
        else buildLevel(true);
      });
      document.getElementById('btnModalBoss').addEventListener('click', warpToBossCorridor);

      // 素材工坊控件
      document.querySelectorAll('.asset-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.asset-tab').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          AssetManager.activeTab = btn.dataset.tab;
          AssetManager.renderGrid();
        });
      });

      document.getElementById('optAutoKey').addEventListener('change', (e) => {
        AssetManager.autoKey = e.target.checked;
        AssetManager.rebuildAll();
      });

      document.getElementById('optTolerance').addEventListener('input', (e) => {
        AssetManager.tolerance = Number(e.target.value);
        document.getElementById('optTolVal').textContent = e.target.value;
      });
      document.getElementById('optTolerance').addEventListener('change', () => AssetManager.rebuildAll());

      document.getElementById('optGrid').addEventListener('change', (e) => {
        AssetManager.grid = e.target.value;
        AssetManager.rebuildAll();
      });
      document.getElementById('btnClearAllAssets').addEventListener('click', () => AssetManager.clearAll());

      // 移动端触控
      function bindHold(id, prop) {
        const el = document.getElementById(id);
        const on = (e) => { e.preventDefault(); keys[prop] = true; };
        const off = (e) => { e.preventDefault(); keys[prop] = false; };
        el.addEventListener('touchstart', on, { passive: false });
        el.addEventListener('touchend', off, { passive: false });
        el.addEventListener('touchcancel', off, { passive: false });
      }
      bindHold('tLeft', 'left');
      bindHold('tRight', 'right');
      bindHold('tDown', 'down');
      document.getElementById('tJump').addEventListener('touchstart', (e) => { e.preventDefault(); keys.jumpHeld = true; triggerJump(); }, { passive: false });
      document.getElementById('tJump').addEventListener('touchend', (e) => { e.preventDefault(); keys.jumpHeld = false; }, { passive: false });
      document.getElementById('tDash').addEventListener('touchstart', (e) => { e.preventDefault(); triggerDash(); }, { passive: false });
      document.getElementById('tAtk').addEventListener('touchstart', (e) => { e.preventDefault(); triggerAttack(); }, { passive: false });

      // 启动游戏
      let lastTime = 0;
      function loop(ts) {
        if (!lastTime) lastTime = ts;
        const rawDt = Math.min(0.05, Math.max(0.001, (ts - lastTime) / 1000));
        lastTime = ts;
        updateGame(rawDt);
        render();
        requestAnimationFrame(loop);
      }

      window.onload = () => {
        buildLevel(true);
        AssetManager.renderGrid();
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
</html>
